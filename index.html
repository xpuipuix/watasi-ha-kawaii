<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>立花くん 監獄なう 〜BAN収監中〜</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, #3a3a3a 0%, #4a4a4a 50%, #2e2e2e 100%);
      background-attachment: fixed;
      color: #453a52;
      min-height: 100vh;
    }

    /* ヘッダー */
    .header {
      background: repeating-linear-gradient(90deg, #1a1a1a 0px, #1a1a1a 24px, #e8b400 24px, #e8b400 30px);
      border-bottom: 3px solid #faf5ff;
      padding: 16px 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 20px;
      color: #fff;
      font-weight: bold;
      text-shadow: 0 1px 3px rgba(40,120,80,0.3);
    }
    .header .subtitle {
      font-size: 13px;
      color: #faf5ff;
      margin-top: 4px;
    }

    .main { display: flex; height: calc(100vh - 64px); }

    /* 左：BANカード */
    .left-panel {
      width: 340px;
      min-width: 300px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(8px);
      border-right: 1px solid rgba(255,255,255,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      overflow-y: auto;
    }

    .ban-badge {
      background: #ff4d4d;
      color: white;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 14px;
      border-radius: 20px;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes sparkle { 0%,100%{transform:scale(1) rotate(0deg)} 50%{transform:scale(1.3) rotate(180deg)} }

    .avatar-wrap { animation: float 3s ease-in-out infinite; margin-bottom: 10px; }
    .avatar-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(214, 245, 214, 0.7);
      border: 3px solid #a67ee6;
    }


    .avatar-wrap { position: relative; }
    .avatar-wrap::after {
      content: '';
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 100px; height: 100px; border-radius: 50%;
      background: repeating-linear-gradient(90deg, transparent 0px, transparent 14px, rgba(60,60,60,0.85) 14px, rgba(60,60,60,0.85) 20px);
      pointer-events: none;
    }
    .name { font-size: 18px; font-weight: bold; color: #7b3fc4; margin-bottom: 2px; }
    .sub { font-size: 12px; color: #9b7ab0; margin-bottom: 14px; }

    .message-box {
      background: rgba(255, 255, 255, 0.7);
      border: 1.5px solid #c9a3e0;
      border-radius: 16px;
      padding: 12px 16px;
      width: 100%;
      margin-bottom: 12px;
      text-align: center;
    }
    .message-main { font-size: 16px; font-weight: bold; color: #7b3fc4; margin-bottom: 6px; line-height: 1.5; }
    .message-sub { font-size: 13px; color: #9b7ab0; line-height: 1.6; }

    .countdown-wrap { width: 100%; margin-bottom: 10px; }
    .countdown-label { display: flex; justify-content: space-between; font-size: 11px; color: #9b7ab0; margin-bottom: 5px; }
    .bar-outer { height: 7px; background: rgba(255,255,255,0.6); border-radius: 4px; overflow: hidden; }
    .bar-inner { height: 100%; background: linear-gradient(90deg, #a67ee6, #7d4fd4); border-radius: 4px; transition: width 1s; }

    .days-row { display: flex; gap: 4px; width: 100%; margin-bottom: 16px; }
    .day-chip {
      flex: 1; padding: 6px 2px; border-radius: 8px; font-size: 9px;
      color: #9b7ab0; background: rgba(255,255,255,0.6); border: 1px solid #dcc5e8; text-align: center;
    }
    .day-chip.done { background: #e8dcf5; border-color: #a67ee6; color: #7b3fc4; }
    .day-chip.today { background: #fff3e0; border-color: #ffb74d; color: #e65100; font-weight: bold; }
    .day-num { font-size: 13px; display: block; margin-bottom: 1px; }

    .twitch-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 12px; border-radius: 10px;
      background: #9147ff; color: white; font-size: 14px; font-weight: bold;
      cursor: pointer; border: none; text-decoration: none; transition: opacity 0.15s;
    }
    .twitch-btn:hover { opacity: 0.85; }
    .twitch-icon { width: 18px; height: 18px; fill: white; }

    .sparkles { font-size: 16px; display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
    .sp { animation: sparkle 2s ease-in-out infinite; display: inline-block; }
    .sp:nth-child(2) { animation-delay: 0.3s; }
    .sp:nth-child(3) { animation-delay: 0.6s; }

    /* 中央：Twitch配信 */
    .center-panel { flex: 1; display: flex; flex-direction: column; background: rgba(255,255,255,0.3); min-width: 0; }
    .stream-header {
      background: rgba(255,255,255,0.55); backdrop-filter: blur(8px);
      padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.6);
      font-size: 14px; font-weight: bold; color: #7b3fc4; display: flex; align-items: center; gap: 8px;
    }
    .stream-wrap { flex: 1; position: relative; background: #000; }
    .stream-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    /* 右：チャット */
    .right-panel {
      width: 320px; min-width: 280px; display: flex; flex-direction: column;
      background: rgba(255,255,255,0.45); backdrop-filter: blur(8px); border-left: 1px solid rgba(255,255,255,0.6);
    }
    .chat-header {
      background: rgba(255,255,255,0.55); padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.6);
      font-size: 14px; font-weight: bold; color: #7b3fc4; display: flex; align-items: center; gap: 8px;
    }
    .chat-dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; animation: pulse 2s infinite; }

    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: #c8a8d0; border-radius: 2px; }

    .msg { display: flex; gap: 10px; align-items: flex-start; animation: fadein 0.3s ease; }
    @keyframes fadein { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #e8b400, #b88a00);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0; font-weight: bold; color: white;
    }
    .msg-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
    .msg-name { font-size: 13px; font-weight: bold; color: #7b3fc4; }
    .del-btn { margin-left: auto; background: none; border: none; cursor: pointer; font-size: 13px; padding: 0 2px; opacity: 0.6; }
    .del-btn:hover { opacity: 1; }
    .msg-time { font-size: 10px; color: #a89ab0; }
    .msg-text { font-size: 14px; color: #4c4558; line-height: 1.5; word-break: break-word; }

    .system-msg { text-align: center; font-size: 11px; color: #9b7ab0; padding: 4px 0; }

    /* 入力欄 */
    .chat-input-area { padding: 12px 16px; background: rgba(255,255,255,0.55); border-top: 1px solid rgba(255,255,255,0.6); }
    .stamp-panel {
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px;
      padding: 6px; background: rgba(255,255,255,0.5); border-radius: 10px;
    }
    .stamp-btn {
      width: 38px; height: 38px; object-fit: contain; cursor: pointer;
      border-radius: 8px; padding: 2px; transition: transform 0.12s, background 0.12s;
    }
    .stamp-btn:hover { transform: scale(1.15); background: rgba(166,126,230,0.25); }
    .stamp-img { max-width: 110px; border-radius: 8px; display: block; }
    .name-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .name-input {
      flex: 1; background: rgba(255,255,255,0.85); border: 1.5px solid #dcc5e8;
      border-radius: 10px; padding: 8px 12px; color: #4c4558; font-size: 13px; outline: none;
    }
    .name-input:focus { border-color: #a67ee6; }
    .name-input::placeholder { color: #c9a8d0; }
    .msg-row { display: flex; gap: 8px; }
    .msg-input {
      flex: 1; background: rgba(255,255,255,0.85); border: 1.5px solid #dcc5e8;
      border-radius: 10px; padding: 10px 14px; color: #4c4558; font-size: 14px;
      outline: none; resize: none; height: 42px;
    }
    .msg-input:focus { border-color: #a67ee6; }
    .msg-input::placeholder { color: #c9a8d0; }
    .send-btn {
      background: linear-gradient(135deg, #e8b400, #b88a00); border: none; border-radius: 10px;
      padding: 0 18px; color: white; font-size: 14px; font-weight: bold; cursor: pointer; transition: opacity 0.15s;
    }
    .send-btn:hover { opacity: 0.85; }
    .send-btn:active { transform: scale(0.97); }
    .char-count { font-size: 10px; color: #a89ab0; text-align: right; margin-top: 4px; }
    .char-count.warn { color: #ff7043; }

    @media (max-width: 850px) {
      .main { flex-direction: column; height: auto; }
      .left-panel { width: 100%; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.6); }
      .center-panel { height: 50vh; min-height: 280px; }
      .right-panel { width: 100%; height: 50vh; border-left: none; border-top: 1px solid rgba(255,255,255,0.6); }
    }
  </style>
</head>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove, child } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // ===== 管理用の合言葉（好きな言葉に書き換えてOK）=====
  const ADMIN_PASSWORD = "big-nyurin-police";
  let isAdmin = false;

  const firebaseConfig = {
    apiKey: "AIzaSyAthmOYWn6WZdH2NS76e0seNIiAp1PbDq4",
    authDomain: "ban-sareta-family.firebaseapp.com",
    databaseURL: "https://ban-sareta-family-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "ban-sareta-family",
    storageBucket: "ban-sareta-family.firebasestorage.app",
    messagingSenderId: "615118145572",
    appId: "1:615118145572:web:5e5d016b7289835da5b0b1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const messagesRef = ref(db, 'messages_lyco');

  // ===== BANカウントダウン =====
  // BAN開始：2026年7月18日（今日が1日目）
  const BAN_START = new Date('2026-07-18T00:00:00+09:00');
  const BAN_END = new Date('2026-07-25T00:00:00+09:00');  // 7日後
  const BAN_DAYS = 7;
  const TOTAL_MS = BAN_END - BAN_START;

  function updateCountdown() {
    const now = new Date();
    const remainMs = BAN_END - now;
    const elapsedMs = now - BAN_START;
    const elapsedDays = Math.floor(elapsedMs / (1000 * 60 * 60 * 24));
    const dayNum = elapsedDays + 1;

    const badge = document.getElementById('ban-badge');
    const timerEl = document.getElementById('timer');

    if (remainMs <= 0) {
      badge.textContent = '🟢 出所した…';
      badge.style.background = 'linear-gradient(135deg, #7ed957, #5cb85c)';
      document.getElementById('main-msg').textContent = '🕊️ 出所しました！シャバの空気うまい！';
      document.getElementById('days-left').textContent = '0';
      document.getElementById('progress-bar').style.width = '0%';
      timerEl.textContent = '🕯️ 娑婆に戻ってきた…';
    } else {
      const d = Math.floor(remainMs / (1000 * 60 * 60 * 24));
      const h = Math.floor((remainMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((remainMs % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((remainMs % (1000 * 60)) / 1000);
      document.getElementById('days-left').textContent = d;
      timerEl.textContent = `${d}日 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      const pct = Math.max(0, Math.min(100, (remainMs / TOTAL_MS) * 100));
      document.getElementById('progress-bar').style.width = pct + '%';
      badge.textContent = `🔴 BAN中 — ${dayNum}日目 / ${BAN_DAYS}日間`;
    }

    const row = document.getElementById('days-row');
    row.innerHTML = '';
    for (let i = 0; i < BAN_DAYS; i++) {
      const chip = document.createElement('div');
      chip.className = 'day-chip' + (i < elapsedDays ? ' done' : i === elapsedDays ? ' today' : '');
      chip.innerHTML = `<span class="day-num">${i < elapsedDays ? '✓' : i === elapsedDays ? '📺' : (i + 1)}</span>${i + 1}日目`;
      row.appendChild(chip);
    }
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);

  // ===== チャット =====
  function escHtml(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var latestMsgs = [];

  function renderChat() {
    var container = document.getElementById('chat-messages');
    container.innerHTML = '<div class="system-msg">チャットへようこそ！立花くんへの差し入れメッセージを送ろう🔒</div>';
    var shown = latestMsgs.slice(-100);
    for (var i = 0; i < shown.length; i++) {
      try {
        var m = shown[i];
        var nameStr = (m.name == null || m.name === '') ? '名無し' : String(m.name);
        var textStr = (m.text == null) ? '' : String(m.text);
        var initial = nameStr.charAt(0).toUpperCase() || '?';
        var time = '';
        if (m.timestamp) {
          var d = new Date(Number(m.timestamp));
          if (!isNaN(d.getTime())) {
            time = d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
          }
        }
        var el = document.createElement('div');
        el.className = 'msg';
        var delBtn = isAdmin ? '<button class="del-btn" data-key="' + escHtml(m.key) + '" title="削除">🗑️</button>' : '';
        el.innerHTML =
          '<div class="msg-avatar">' + escHtml(initial) + '</div>' +
          '<div class="msg-content">' +
            '<div class="msg-header">' +
              '<span class="msg-name">' + escHtml(nameStr) + '</span>' +
              '<span class="msg-time">' + time + '</span>' +
              delBtn +
            '</div>' +
            '<div class="msg-text">' + (m.stamp ? '<img class="stamp-img" src="' + escHtml(m.stamp) + '" alt="stamp">' : escHtml(textStr)) + '</div>' +
          '</div>';
        container.appendChild(el);
      } catch (e) { console.warn('[chat] 表示スキップ', i, e); }
    }
    if (isAdmin) {
      var btns = container.querySelectorAll('.del-btn');
      for (var j = 0; j < btns.length; j++) {
        btns[j].addEventListener('click', function() {
          var key = this.getAttribute('data-key');
          if (confirm('このメッセージを削除する？')) {
            remove(child(messagesRef, key)).catch(function(err) { alert('削除に失敗: ' + err.message); });
          }
        });
      }
    }
    container.scrollTop = container.scrollHeight;
  }

  onValue(messagesRef, function(snapshot) {
    latestMsgs = [];
    snapshot.forEach(function(child) {
      var v = child.val() || {};
      latestMsgs.push({ key: child.key, name: v.name, text: v.text, timestamp: v.timestamp, stamp: v.stamp });
    });
    renderChat();
    if (window.__speakNew) window.__speakNew(latestMsgs);
  }, function(error) { console.error('[chat] 受信エラー:', error); });

  // ===== 荒らし対策 =====
  const NG_WORDS = ['死ね', '殺す', 'きもい', 'うざい', 'ブス', 'デブ', 'ばか', 'アホ', 'クズ', 'カス', 'fuck', 'shit', 'バカ'];
  const COOLDOWN_MS = 5000;
  const MAX_LENGTH = 200;
  let lastSentTime = 0;
  let lastSentText = '';

  function showWarning(msg) {
    const el = document.getElementById('warning-msg');
    el.textContent = '⚠️ ' + msg;
    el.style.display = 'block';
    clearTimeout(el._timer);
    el._timer = setTimeout(() => { el.style.display = 'none'; }, 3000);
  }

  window.sendMessage = function() {
    if (!isAdmin) { showWarning('コメントは看守（本人）だけ。🔧から合言葉を入れてね'); return; }
    const name = document.getElementById('name-input').value.trim() || '立花くん';
    const text = document.getElementById('msg-input').value.trim();
    if (!text) return;
    if (text.length > MAX_LENGTH) { showWarning(`メッセージは${MAX_LENGTH}文字までだよ`); return; }
    const now = Date.now();
    if (now - lastSentTime < COOLDOWN_MS) {
      showWarning(`連投はダメ！あと${Math.ceil((COOLDOWN_MS - (now - lastSentTime)) / 1000)}秒待ってね`); return;
    }
    if (text === lastSentText) { showWarning('同じメッセージは送れないよ'); return; }
    const lower = text.toLowerCase();
    if (NG_WORDS.find(w => lower.includes(w.toLowerCase()))) { showWarning('その言葉は使えないよ。やさしい言葉でね💜'); return; }
    push(messagesRef, { name, text, timestamp: Date.now() });
    lastSentTime = now;
    lastSentText = text;
    document.getElementById('msg-input').value = '';
    document.getElementById('char-count').textContent = '0 / 200';
  };

  var msgInputEl = document.getElementById('msg-input');
  if (msgInputEl) {
    msgInputEl.addEventListener('input', function() {
      const len = this.value.length;
      const el = document.getElementById('char-count');
      if (el) { el.textContent = `${len} / 200`; el.className = 'char-count' + (len > 180 ? ' warn' : ''); }
    });
    msgInputEl.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.sendMessage(); }
    });
  }

  var adminBtnEl = document.getElementById('admin-btn');
  if (adminBtnEl) {
    adminBtnEl.addEventListener('click', function() {
      if (isAdmin) {
        isAdmin = false; this.style.opacity = '0.4'; renderChat(); alert('管理モードを終了しました');
      } else {
        var pw = prompt('合言葉を入力してください');
        if (pw === null) return;
        if (pw === ADMIN_PASSWORD) {
          isAdmin = true; this.style.opacity = '1'; renderChat();
          alert('管理モードON！各メッセージに🗑️が出ます。もう一度🔧で終了。');
        } else { alert('合言葉が違います'); }
      }
    });
  }

  // ===== スタンプ送信 =====
  var stampBtns = document.querySelectorAll('.stamp-btn');
  for (var k = 0; k < stampBtns.length; k++) {
    stampBtns[k].addEventListener('click', function() {
      if (!isAdmin) { showWarning('コメントは看守（本人）だけ。🔧から合言葉を入れてね'); return; }
      var now = Date.now();
      if (now - lastSentTime < COOLDOWN_MS) {
        showWarning('連投はダメ！あと' + Math.ceil((COOLDOWN_MS - (now - lastSentTime)) / 1000) + '秒待ってね');
        return;
      }
      var nameEl = document.getElementById('name-input');
      var name = (nameEl && nameEl.value.trim()) || '立花くん';
      var stampFile = this.getAttribute('data-stamp');
      push(messagesRef, { name: name, text: '[スタンプ]', stamp: stampFile, timestamp: Date.now() });
      lastSentTime = now;
    });
  }

  // ===== 読み上げ機能 =====
  var ttsOn = false;
  var spokenKeys = {};      // 既に読んだメッセージ
  var ttsReady = false;     // 初回読み込み後から読み始める

  window.__speakNew = function(msgs) {
    if (!ttsReady) {
      // 初回はぜんぶ既読にして読まない
      for (var i = 0; i < msgs.length; i++) spokenKeys[msgs[i].key] = true;
      ttsReady = true;
      return;
    }
    if (!ttsOn) {
      for (var j = 0; j < msgs.length; j++) spokenKeys[msgs[j].key] = true;
      return;
    }
    for (var k = 0; k < msgs.length; k++) {
      var m = msgs[k];
      if (spokenKeys[m.key]) continue;
      spokenKeys[m.key] = true;
      if (m.stamp) continue;  // スタンプは読まない
      var nameStr = (m.name == null || m.name === '') ? '名無し' : String(m.name);
      var textStr = (m.text == null) ? '' : String(m.text);
      if (!textStr) continue;
      try {
        var u = new SpeechSynthesisUtterance(nameStr + '、' + textStr);
        u.lang = 'ja-JP';
        u.rate = 1.0;
        window.speechSynthesis.speak(u);
      } catch (e) { console.warn('読み上げ失敗', e); }
    }
  };

  var ttsBtnEl = document.getElementById('tts-btn');
  if (ttsBtnEl) {
    ttsBtnEl.addEventListener('click', function() {
      if (!('speechSynthesis' in window)) {
        alert('このブラウザは読み上げに対応していません');
        return;
      }
      ttsOn = !ttsOn;
      this.textContent = ttsOn ? '🔊' : '🔇';
      this.style.opacity = ttsOn ? '1' : '0.4';
      if (ttsOn) {
        var u = new SpeechSynthesisUtterance('読み上げをオンにしました');
        u.lang = 'ja-JP';
        window.speechSynthesis.speak(u);
      } else {
        window.speechSynthesis.cancel();
      }
    });
  }
</script>

</body>
</html>
